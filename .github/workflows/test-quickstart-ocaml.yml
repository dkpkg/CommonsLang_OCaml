name: test-quickstart-ocaml
# Manual guard for the `dk0 quickstart ocaml` recipes.
#
# WHY IT LIVES HERE. The quickstart's closure-driver step is this package's own
# rule (CommonsLang_OCaml.Dk.OpamLock.Adopt/Refresh), and that rule requires the
# CommonsBase_Std distribution. A quickstart recipe (in dksdk-coder) that does not
# import a distribution the driver requires produces a project that cannot
# regenerate its driver -- "Could not use <X> because the distribution has not
# been imported." Each job scaffolds a fresh quickstart against the LIVE recipe,
# resolves its imports with `dk1 update`, and asserts that CommonsBase_Std -- the
# distribution the driver requires -- is present in the imported set etc/dk/i. It
# does not run the driver: the fresh-project generate step (Adopt) needs the
# user's own opam package, so a driver run on a bare quickstart fails for an
# unrelated reason.
#
# ONE JOB PER RECIPE. The recipes run in a matrix so each is on its OWN runner and
# shares no dk data directories (the launcher's ~/.local/share/dk<n> engine
# install and ~/.cache/dk object cache) with the other. A shared cache could let
# one recipe's imports mask a missing import in another.
#
# WHY MANUAL. It depends on the network and on the deployed recipe, so it is not a
# push gate. The periodic dk-ecosystem release exercise invokes it (workflow_dispatch);
# a maintainer can also run it from the Actions tab.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quickstart-ocaml:
    strategy:
      fail-fast: false
      matrix:
        recipe: [opam414, opam550]
    runs-on: ubuntu-latest
    env:
      RECIPE: ${{ matrix.recipe }}
    steps:
      - name: Checkout (for the vendored dk0/dk1 launchers)
        uses: actions/checkout@v6
      - name: Scaffold, resolve imports, and assert the driver's required distribution is present
        shell: bash
        run: |
          set -euo pipefail
          name="$RECIPE"
          # A fresh dir with no dk.u floats the launcher on the latest engine,
          # which is what a new user gets. The vendored launchers self-install it.
          mkdir work
          cp dk0 dk1 work/
          cd work
          ./dk0 quickstart ocaml "$name" --dir proj
          cp ../dk0 ../dk1 proj/
          cd proj
          ./dk1 update
          echo "imported distributions (etc/dk/i):"
          ls etc/dk/i
          # The closure driver requires the CommonsBase_Std distribution; after
          # dk1 update resolves the recipe's imports it must be present here.
          if ! ls etc/dk/i | grep -q '^CommonsBase_Std\.'; then
            echo "::error::quickstart ocaml $name did not import CommonsBase_Std, which the closure driver requires."
            exit 1
          fi
          echo "OK: quickstart ocaml $name imports CommonsBase_Std"
