name: test-wrapper-guards
# Red/green demonstration of the two dk0 wrapper-script security guards, run
# against the landed wrapper (diskuv/dk V2_5). It is manual: it exists to show
# the guards fire, not to gate every push.
#
# GUARD 1, the manifest-downgrade refusal. When dk.u pins a version, the wrapper
# refuses a signify-verified manifest whose version is older than the pin. The
# demonstration serves a genuine OLDER signed manifest under the pinned (newer)
# filename from a committed https fixture (ci/wrapper-guard-fixtures, read over
# raw.githubusercontent.com) and points DK0_BASE_URL at it: the signature
# verifies (the manifest is genuine) and the guard still refuses it. The green
# case serves the matching version and is accepted.
#
# GUARD 2, the CommonsBase_Dk host narrowing. The wrapper downloads the binary
# only from github.com/dkpkg/CommonsBase_Dk or the dk-dist GitLab registry. A
# signed manifest cannot carry a sibling-repo URL (signify would reject a
# tampered manifest), so the narrowing is shown at the dk_allow_host function:
# it accepts a CommonsBase_Dk URL and the GitLab registry and rejects a sibling
# dkpkg repository.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  wrapper-guards:
    runs-on: ubuntu-latest
    steps:
      - name: Refuse a downgrade and reject a sibling binary host
        shell: bash
        run: |
          set -uo pipefail
          fails=0
          NEW=2.4.3.21
          OLD=2.4.3.20
          # The landed guard-carrying wrapper.
          curl -fsSL -o dk0 "https://raw.githubusercontent.com/diskuv/dk/b776aca98550f54ad23dad024e3aa2b68767ccd3/dk0"
          chmod +x dk0

          # The wrapper accepts an https base URL; GitHub serves the fixtures over
          # https at raw.githubusercontent.com for the sha this run checked out.
          RAW="https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/${GITHUB_SHA}/ci/wrapper-guard-fixtures"

          echo "======== GUARD 1 RED: pin $NEW, base URL serves a genuine $OLD manifest under the pinned name ========"
          mkdir -p redproj && cp dk0 redproj/
          echo "%% actual_version(\"$NEW\")" > redproj/dk.u
          set +e
          out=$(cd redproj && DK0_BASE_URL="$RAW/downgrade" ./dk0 version 2>&1); rc=$?
          set -e
          echo "$out"
          if echo "$out" | grep -q "manifest downgrade refused" && [ "$rc" -ne 0 ]; then
            echo "RED-OK: the guard refused the older manifest (pin $NEW, base URL served $OLD)."
          else
            echo "RED-FAIL: the older manifest was not refused (rc=$rc)."; fails=1
          fi

          echo "======== GUARD 1 GREEN: pin $OLD, base URL serves the matching $OLD manifest ========"
          mkdir -p greenproj && cp dk0 greenproj/
          echo "%% actual_version(\"$OLD\")" > greenproj/dk.u
          set +e
          out=$(cd greenproj && DK0_BASE_URL="$RAW/ok" ./dk0 version 2>&1); rc=$?
          set -e
          echo "$out"
          if echo "$out" | grep -q "manifest downgrade refused"; then
            echo "GREEN-FAIL: a matching pin was wrongly refused."; fails=1
          else
            echo "GREEN-OK: the matching pin passed the downgrade guard."
          fi

          echo "======== GUARD 2: dk_allow_host accepts CommonsBase_Dk and the GitLab registry, rejects a sibling ========"
          sed -n '/^dk_allow_host()/,/^}/p' dk0 > allow.sh
          . ./allow.sh
          set +e
          dk_allow_host "https://github.com/dkpkg/CommonsBase_Dk/releases/download/x/dk0-linux_x86_64"; cbd=$?
          dk_allow_host "https://github.com/dkpkg/CommonsBase_Dk_x/releases/download/x/dk0-linux_x86_64"; sib=$?
          dk_allow_host "https://github.com/dkpkg/EvilRepo/releases/download/x/dk0-linux_x86_64"; evil=$?
          dk_allow_host "https://gitlab.com/api/v4/projects/60486861/packages/generic/dk-dist/x/dk0-linux_x86_64"; gl=$?
          set -e
          [ "$cbd" -eq 0 ]  && echo "HOST-OK: CommonsBase_Dk accepted"            || { echo "HOST-FAIL: CommonsBase_Dk rejected"; fails=1; }
          [ "$gl" -eq 0 ]   && echo "HOST-OK: gitlab dk-dist registry accepted"   || { echo "HOST-FAIL: gitlab registry rejected"; fails=1; }
          [ "$sib" -ne 0 ]  && echo "HOST-OK: sibling CommonsBase_Dk_x rejected"  || { echo "HOST-FAIL: sibling prefix accepted"; fails=1; }
          [ "$evil" -ne 0 ] && echo "HOST-OK: sibling EvilRepo rejected"          || { echo "HOST-FAIL: sibling repo accepted"; fails=1; }

          echo "========================================================"
          if [ "$fails" -ne 0 ]; then
            echo "::error::a wrapper guard did not behave as expected."
            exit 1
          fi
          echo "OK: both wrapper guards behaved as expected (downgrade refused, sibling host rejected)."
